# Configuração do pipeline de detecção e score.
# A ideia: você (ou depois, o sistema de aprendizado) mexe SÓ aqui,
# sem precisar tocar no código do core/.

whisper:
  model_size: medium       # tiny | base | small | medium | large-v3
  language: null          # null = detecta sozinho (amostra 3 pontos do vídeo); ou fixe "en", "pt" etc se preferir
scene_detection:
  # sensibilidade da detecção de corte de cena / mudança visual brusca
  threshold: 27.0
  min_scene_len_seconds: 2.0

audio_analysis:
  # detecta picos de energia/volume (gritos, reações) e mudanças bruscas de intensidade
  peak_sensitivity: 1.8   # desvios-padrão acima da média pra considerar "pico"
  window_seconds: 3.0

candidate_moments:
  # REBUILD: a duração agora é CONSEQUÊNCIA do conteúdo, não uma meta.
  # Estes dois são proteção contra caso degenerado, não alvo:
  min_duration_seconds: 5      # abaixo disso não funciona em lugar nenhum
  max_duration_seconds: 75     # acima disso não é short-form

  # Quanto o clipe pode voltar pra dar contexto (busca início de frase).
  context_padding_seconds: 10
  # Quanto pode avançar depois do payoff pra fechar a frase.
  tail_padding_seconds: 8

  # Janela de agrupamento de sinais num evento. Medida a partir do INÍCIO do
  # grupo — antes era medida do último sinal, e isso encadeava: sinais a
  # cada 4s transformavam 3 minutos num evento só.
  event_window_seconds: 6.0

  # Silêncio a partir do qual dois eventos viram histórias diferentes.
  # Menor = mais clipes e mais curtos. Maior = clipes mais longos.
  story_max_silence_seconds: 4.0

# Quantidade e variedade dos clipes gerados (usado pelo montage.py).
# Teto de renderização (a seleção editorial mora em "selection").
clip_selection:
  max_clips: 20
  min_clips: 1

# ============================================================
# V2 — descoberta e seleção separadas
# ============================================================
# A ideia central: DESCOBRIR MUITO, FILTRAR DEPOIS. O sistema antigo
# filtrava enquanto descobria, e por isso perdia oportunidades.

discovery:
  # Cota PROPORCIONAL à duração do vídeo. Um teto global fazia a análise
  # parar no meio de VODs longos: 3 horas de live viravam clipes só dos
  # primeiros 20 minutos.
  max_candidates_per_hour: 60
  absolute_max_candidates: 600   # proteção de memória, não meta

selection:
  # "auto" = a quantidade sai da QUALIDADE disponível. Um vídeo fraco não
  # rende 10 clipes ruins só porque alguém pediu 10.
  # Aceita também um número fixo: 5, 10, 15, 20, 30.
  max_final_clips: auto
  auto_quality_threshold: 55.0   # nota a partir da qual o clipe "presta"
  auto_max_clips: 20             # teto de segurança do modo auto
  auto_min_clips: 3              # mesmo num vídeo fraco, entrega os melhores
  min_score: 40.0
  diversity_enabled: true
  category_diversity_weight: 0.35   # evita 5 clipes do mesmo tipo
  temporal_diversity_weight: 0.2    # evita 5 clipes seguidos do mesmo trecho

story:
  # §9: limite da HISTÓRIA (o contexto), independente do limite do CLIPE.
  # Uma história de 150s é legítima — ela vira candidatos menores depois.
  story_max_duration_seconds: 180

clip_duration:
  # Limites do CLIPE. NÃO metas. A duração é consequência do conteúdo: uma história
  # pode legitimamente ter 18s, 42s ou 63s.
  absolute_min_seconds: 8
  ideal_min_seconds: 15
  ideal_max_seconds: 45
  absolute_max_seconds: 75

context:
  max_context_seconds: 45

deduplication:
  temporal_overlap_threshold: 0.6
  semantic_similarity_threshold: 0.75

# Pesos da avaliação editorial (core/editorial.py).
# standalone tem o maior peso de propósito: "quem assistir só este clipe
# entende o que aconteceu?" é a pergunta que mais separa clipe bom de ruim.
editorial:
  standalone: 1.4
  short_form_fit: 0.6
  context: 1.1
  payoff: 1.2
  hook: 1.0
  narrative_completeness: 1.0
  emotion: 0.9
  ending: 0.8
  originality: 0.3

# Pesos do Content Score — SOMA NÃO PRECISA SER 100, é normalizado.
# Este é o "perfil default". Fase 3 vai ter 1 perfil destes por canal/usuário,
# ajustado automaticamente pelo resultado real dos vídeos publicados.
content_score_weights:
  gameplay_intensity: 1.0
  emotional_reaction: 1.0
  narrative_context: 0.8
  retention_potential: 1.0
  originality: 0.0   # era constante 60.0 — não distinguia nada, só diluía a média
  # abaixo: só ficam ativos quando há dado de chat/audiência disponível (Fase 2+)
  chat_reaction: 0.0
  comment_potential: 0.0

  # REBUILD: peso alto de propósito — um momento intenso que não se entende
  # sozinho não deve vencer um clipe completo e compreensível.
  story_completeness: 1.4
  # Sinais da Fase 5, agora ATIVOS (antes eram calculados e ignorados):
  hook: 0.9
  surprise: 0.6
  ending_quality: 0.7
  visual_clarity: 0.3

  # Ainda sem dado real — deixe em 0.0 até existir base.
  share_potential: 0.0
  vertical_suitability: 0.0
  viral_potential: 0.0


# Geração de título por IA (opcional) — usado no thumbnail.
#
# ⚠️ NUNCA coloque a chave de API aqui, nem em comentário.
# Este arquivo VAI pro Git; o .env NÃO vai.
# A chave mora só no .env, na variável OPENAI_API_KEY, e é lida
# exclusivamente por core.app_config.get_ai_api_key().
#
# Com enabled: false, o app usa o método antigo (extrai da fala), sem custo.
ai_title:
  enabled: false
  model: gpt-4o-mini        # modelo mais barato da OpenAI, ótimo pra título curto
