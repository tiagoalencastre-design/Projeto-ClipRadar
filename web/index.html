<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipRadar — Painel</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a href="/" class="brand" title="Voltar pra página inicial">
      <img src="/assets/logo.png" alt="ClipRadar" style="width:24px; height:24px; border-radius:6px; object-fit:cover;">
      ClipRadar
    </a>
    <div class="nav-item primary" id="navCreate">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="navCreateLabel"></span>
    </div>
    <div class="nav-item active" id="navProjects">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/></svg>
      <span id="navProjectsLabel"></span>
    </div>
    <div class="nav-item" id="navLibrary">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/></svg>
      <span id="navLibraryLabel"></span>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-item disabled">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 6.2L21 9l-5 4.3 1.5 6.7L12 16.9 6.5 20l1.5-6.7L3 9l6.4-.8L12 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span id="navBrandLabel"></span><span class="nav-soon" id="navSoon1"></span>
    </div>
    <div class="nav-item disabled">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 19V10M12 19V4M20 19v-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="navAnalyticsLabel"></span><span class="nav-soon" id="navSoon2"></span>
    </div>
    <div class="nav-item disabled">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="navSettingsLabel"></span><span class="nav-soon" id="navSoon3"></span>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="btn btn-ghost sidebar-toggle" id="sidebarToggle" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="status-pill" id="statusPill">...</div>
      </div>
      <div class="user-menu">
        <div class="user-avatar" id="userAvatarBtn">CR</div>
        <div class="user-dropdown" id="userDropdown">
          <div class="item" id="userSettingsItem"></div>
          <div class="item" id="userSignOutItem"></div>
        </div>
      </div>
    </header>

    <main class="content">

      <!-- ===== HOME / CRIAR PROJETO ===== -->
      <section class="view active" id="viewHome">
        <div class="page-greeting">
          <h1 id="greetingTitle"></h1>
          <p id="greetingSubtitle"></p>
        </div>

        <div class="card upload-card">
          <div class="upload-dropzone" id="uploadDrop">
            <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
            <div><strong id="dropzoneTitle"></strong></div>
            <div class="formats" id="dropzoneFormats"></div>
            <input type="file" id="uploadInput" accept=".mp4,.mov,.mkv,.webm" style="display:none;">
          </div>

          <div class="youtube-row">
            <input type="url" id="youtubeUrlInput" placeholder="https://youtube.com/...">
            <button class="btn btn-secondary" id="youtubeDownloadBtn"></button>
          </div>

          <div class="source-alt-toggle" id="folderToggle"></div>
          <div class="folder-picker" id="folderPicker">
            <span class="field-label" id="labelFolderVideo"></span>
            <select id="videoSelect"></select>
          </div>

          <div class="options-row">
            <div>
              <span class="field-label" id="labelMode"></span>
              <div class="tabs" id="modeTabs">
                <div class="tab active" data-value="montage" data-i18n="mode_montage"></div>
                <div class="tab" data-value="separate" data-i18n="mode_separate"></div>
                <div class="tab" data-value="review" data-i18n="mode_review"></div>
              </div>
            </div>
            <div>
              <span class="field-label" id="labelFormat"></span>
              <div class="tabs" id="orientationTabs">
                <div class="tab active" data-value="vertical" data-i18n="format_vertical"></div>
                <div class="tab" data-value="horizontal" data-i18n="format_horizontal"></div>
              </div>
            </div>
            <div>
              <span class="field-label" id="labelPlatform"></span>
              <div class="tabs" id="platformTabs">
                <div class="tab active" data-value="sem_preferencia" data-i18n="platform_none"></div>
                <div class="tab" data-value="tiktok">TikTok</div>
                <div class="tab" data-value="reels">Reels</div>
                <div class="tab" data-value="shorts">Shorts</div>
              </div>
            </div>
            <div>
              <span class="field-label" id="labelSubtitleStyle"></span>
              <select id="subtitleStyleSelect">
                <option value="classic" data-i18n="style_classic"></option>
                <option value="bold_yellow" data-i18n="style_bold_yellow"></option>
                <option value="minimal_top" data-i18n="style_minimal_top"></option>
                <option value="boxed" data-i18n="style_boxed"></option>
              </select>
            </div>
            <div style="display:flex; align-items:flex-end;">
              <div class="checkbox-row">
                <input type="checkbox" id="captionsCheckbox" checked>
                <label for="captionsCheckbox" id="labelCaptions"></label>
              </div>
            </div>
          </div>

          <div style="margin-top:20px;">
            <button class="btn btn-primary" id="generateBtn" style="width:100%; height:48px;"></button>
          </div>
          <div id="errorBox"></div>
        </div>

        <h3 style="font-size:1rem; margin-bottom:14px;" id="recentTitle"></h3>
        <div id="recentContainer"></div>
      </section>

      <!-- ===== PROCESSAMENTO ===== -->
      <!-- ===== BIBLIOTECA DE CLIPS ===== -->
      <section class="view" id="viewLibrary">
        <div class="card">
          <h2 id="libraryTitle" style="margin-bottom:6px"></h2>
          <p class="muted" id="librarySubtitle" style="margin-bottom:18px"></p>
          <div id="libraryGrid" class="library-grid"></div>
          <div id="libraryEmpty" style="display:none"></div>
        </div>
      </section>

      <section class="view" id="viewProcessing">
        <div class="processing-wrap">
          <div class="processing-title">
            <h2 id="processingTitle"></h2>
            <p id="processingSubtitle"></p>
          </div>
          <div class="card">
            <div class="steps-list" id="stepsList"></div>
          </div>
          <div class="processing-disclaimer" id="processingDisclaimer"></div>
        </div>
      </section>

      <!-- ===== RESULTADOS ===== -->
      <section class="view" id="viewResults">
        <div class="results-header">
          <h1 id="resultsTitle"></h1>
          <button class="btn btn-secondary" id="backToHomeBtn"></button>
        </div>
        <div class="results-layout">
          <div class="clip-list" id="clipList"></div>
          <div class="card clip-preview" id="clipPreviewCard" style="padding:24px;">
            <video id="clipPreviewVideo" controls></video>
            <div class="card why" id="clipWhyBox" style="display:none;"></div>
          </div>
          <div class="card clip-panel" id="clipPanel"></div>
        </div>
      </section>

      <!-- ===== REVISÃO MANUAL ===== -->
      <section class="view" id="viewReview">
        <div class="results-header">
          <h1 id="reviewTitle"></h1>
          <button class="btn btn-secondary" id="backToHomeFromReviewBtn"></button>
        </div>
        <div class="results-layout" id="reviewLayout">
          <div class="clip-list" id="reviewCandidateList"></div>

          <div class="card" id="reviewCenterCard" style="padding:22px;">
            <video id="reviewPreviewVideo" controls style="width:100%; border-radius:var(--radius-md); background:black; margin-bottom:16px;"></video>

            <div class="trim-row">
              <div class="trim-field">
                <span class="field-label" id="labelTrimStart"></span>
                <div class="trim-controls">
                  <button class="btn-trim" data-target="start" data-delta="-1">-1s</button>
                  <button class="btn-trim" data-target="start" data-delta="-0.5">-.5</button>
                  <input type="text" id="trimStartInput" class="trim-input">
                  <button class="btn-trim" data-target="start" data-delta="0.5">+.5</button>
                  <button class="btn-trim" data-target="start" data-delta="1">+1s</button>
                </div>
              </div>
              <div class="trim-field">
                <span class="field-label" id="labelTrimEnd"></span>
                <div class="trim-controls">
                  <button class="btn-trim" data-target="end" data-delta="-1">-1s</button>
                  <button class="btn-trim" data-target="end" data-delta="-0.5">-.5</button>
                  <input type="text" id="trimEndInput" class="trim-input">
                  <button class="btn-trim" data-target="end" data-delta="0.5">+.5</button>
                  <button class="btn-trim" data-target="end" data-delta="1">+1s</button>
                </div>
              </div>
            </div>

            <span class="field-label" id="labelTranscript" style="margin-top:16px;"></span>
            <p class="transcript-hint" id="transcriptHint"></p>
            <div class="transcript-panel" id="transcriptPanel"></div>

            <div id="reviewResultBox" style="display:none;"></div>
          </div>

          <div class="card clip-panel" id="reviewPanel"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<div id="toastRegion"></div>

<div class="modal-backdrop" id="soonModal">
  <div class="modal-box">
    <h3 id="soonModalTitle"></h3>
    <p id="soonModalBody"></p>
    <button class="btn btn-primary" id="soonModalClose"></button>
  </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
