<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipRadar — Painel</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #05070d;
    --bg-panel: #0d1119;
    --bg-panel-2: #11151f;
    --border-subtle: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --accent-lime: #7CFC3C;
    --accent-lime-soft: rgba(124,252,60,0.12);
    --accent-secondary: #5B7CFA;
    --accent-secondary-soft: rgba(91,124,250,0.14);
    --accent-danger: #F16565;
    --text-primary: #F1F3F8;
    --text-muted: #8B93A7;
    --text-faint: #5B6273;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-void); color: var(--text-primary);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  a { color: inherit; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0; letter-spacing: -0.01em; }
  button { font-family: inherit; }

  /* ---------- Componentes reutilizáveis ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 600; font-size: 0.9rem; padding: 10px 18px; border-radius: 10px;
    border: 1px solid transparent; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent-lime); color: #06210a; }
  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
  .btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border-subtle); }
  .btn-secondary:hover { border-color: var(--border-strong); }
  .btn-ghost { background: transparent; color: var(--text-muted); border-color: transparent; padding: 8px 12px; }
  .btn-ghost:hover { color: var(--text-primary); background: var(--bg-panel-2); }
  .btn:focus-visible { outline: 2px solid var(--accent-secondary); outline-offset: 2px; }
  .btn svg { flex-shrink: 0; }

  .card { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }

  .badge {
    display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; letter-spacing: 0.02em;
  }
  .badge-score { background: var(--accent-lime); color: #06210a; font-family: 'Space Grotesk', sans-serif; }
  .badge-tag { background: var(--accent-secondary-soft); color: var(--accent-secondary); }
  .badge-muted { background: var(--bg-panel-2); color: var(--text-faint); border: 1px solid var(--border-subtle); }

  .tabs { display: flex; gap: 6px; }
  .tab {
    flex: 1; text-align: center; font-size: 0.84rem; font-weight: 600; color: var(--text-muted);
    padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border-subtle);
    background: var(--bg-panel-2); cursor: pointer; transition: all 0.15s;
  }
  .tab.active { background: var(--accent-lime-soft); color: var(--accent-lime); border-color: rgba(124,252,60,0.4); }

  .field-label {
    font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 8px; display: block;
  }
  input[type="text"], input[type="url"], select {
    width: 100%; background: var(--bg-panel-2); color: var(--text-primary);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
    padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 0.9rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent-secondary); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; }

  .empty-state {
    text-align: center; padding: 48px 24px; color: var(--text-muted);
  }
  .empty-state .icon { color: var(--text-faint); margin-bottom: 16px; }
  .empty-state h3 { font-size: 1.05rem; color: var(--text-primary); margin-bottom: 6px; }
  .empty-state p { font-size: 0.88rem; max-width: 36ch; margin: 0 auto; }

  .progress-track { height: 6px; background: var(--bg-panel-2); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent-lime); border-radius: 999px; transition: width 0.4s ease; }

  #toastRegion {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    display: flex; flex-direction: column; gap: 10px; max-width: 320px;
  }
  .toast {
    padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.86rem;
    border: 1px solid var(--border-subtle); background: var(--bg-panel);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35); animation: toast-in 0.2s ease;
  }
  .toast.success { border-color: rgba(124,252,60,0.35); }
  .toast.error { border-color: rgba(241,101,101,0.4); color: #ffb3b3; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(5,7,13,0.7); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 150;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 28px; max-width: 380px; text-align: center; }
  .modal-box h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .modal-box p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px; }

  /* ---------- Layout geral: sidebar + conteúdo ---------- */
  .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--bg-panel); border-right: 1px solid var(--border-subtle);
    padding: 20px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .sidebar .brand {
    display: flex; align-items: center; gap: 9px; font-weight: 700; padding: 8px 10px 20px;
    text-decoration: none; color: var(--text-primary); cursor: pointer; border-radius: var(--radius-sm);
  }
  .sidebar .brand:hover { opacity: 0.85; }
  .sidebar .brand svg { flex-shrink: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--radius-sm);
    color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s;
  }
  .nav-item:hover { background: var(--bg-panel-2); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-lime-soft); color: var(--accent-lime); font-weight: 600; }
  .nav-item.primary { background: var(--accent-lime); color: #06210a; font-weight: 700; margin-bottom: 12px; }
  .nav-item.primary:hover { filter: brightness(1.06); color: #06210a; }
  .nav-item.disabled { cursor: default; opacity: 0.55; }
  .nav-item.disabled:hover { background: none; color: var(--text-muted); }
  .nav-soon { margin-left: auto; font-size: 0.65rem; background: var(--bg-panel-2); color: var(--text-faint); padding: 2px 6px; border-radius: 999px; }
  .nav-divider { height: 1px; background: var(--border-subtle); margin: 12px 4px; }

  .main-col { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-void);
  }
  .status-pill {
    font-size: 0.78rem; color: var(--text-muted); background: var(--bg-panel); border: 1px solid var(--border-subtle);
    padding: 5px 12px; border-radius: 999px;
  }
  .user-menu { display: flex; align-items: center; gap: 10px; position: relative; }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 999px; background: var(--accent-secondary-soft);
    color: var(--accent-secondary); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.8rem; cursor: pointer;
  }
  .user-dropdown {
    position: absolute; top: 38px; right: 0; background: var(--bg-panel); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md); padding: 6px; min-width: 160px; display: none; flex-direction: column;
    box-shadow: 0 12px 28px rgba(0,0,0,0.4);
  }
  .user-dropdown.open { display: flex; }
  .user-dropdown .item { padding: 8px 10px; border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
  .user-dropdown .item:hover { background: var(--bg-panel-2); color: var(--text-primary); }

  .content { flex: 1; padding: 32px; overflow-y: auto; }
  .view { display: none; }
  .view.active { display: block; }

  .page-greeting { margin-bottom: 24px; }
  .page-greeting h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .page-greeting p { color: var(--text-muted); font-size: 0.92rem; margin: 0; }

  /* ---------- Upload / fonte do vídeo ---------- */
  .upload-card { padding: 28px; margin-bottom: 24px; }
  .upload-dropzone {
    border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md);
    padding: 36px 20px; text-align: center; cursor: pointer; transition: all 0.15s; margin-bottom: 18px;
  }
  .upload-dropzone:hover { border-color: var(--accent-lime); background: rgba(124,252,60,0.03); }
  .upload-dropzone .icon { color: var(--text-faint); margin-bottom: 12px; }
  .upload-dropzone strong { color: var(--text-primary); }
  .upload-dropzone .formats { font-size: 0.78rem; color: var(--text-faint); margin-top: 8px; }
  .youtube-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .youtube-row input { flex: 1; }
  .source-alt-toggle { font-size: 0.82rem; color: var(--text-faint); cursor: pointer; margin-top: 10px; text-align: center; }
  .source-alt-toggle:hover { color: var(--text-muted); }
  .folder-picker { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-subtle); }
  .folder-picker.open { display: block; }

  .options-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 18px; }
  @media (max-width: 640px) { .options-row { grid-template-columns: 1fr; } }

  .recent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .recent-card { padding: 14px; cursor: pointer; }
  .recent-card .thumb { width: 100%; aspect-ratio: 9/16; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg-panel-2); margin-bottom: 10px; }
  .recent-card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; }
  .recent-card .meta .name { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }

  /* ---------- Processamento ---------- */
  .processing-wrap { max-width: 480px; margin: 40px auto; text-align: center; }
  .processing-wrap .card { padding: 36px 32px; text-align: left; }
  .processing-title { text-align: center; margin-bottom: 28px; }
  .processing-title h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .processing-title p { color: var(--text-muted); font-size: 0.86rem; margin: 0; }
  .steps-list { display: flex; flex-direction: column; gap: 4px; }
  .step-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: var(--radius-sm); }
  .step-row .dot {
    width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 0.7rem; font-weight: 700;
    background: var(--bg-panel-2); color: var(--text-faint); border: 1px solid var(--border-subtle);
  }
  .step-row.done .dot { background: var(--accent-lime); color: #06210a; border-color: transparent; }
  .step-row.active .dot { background: var(--accent-secondary); color: white; border-color: transparent; animation: pulse-dot 1.4s ease infinite; }
  @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 0 rgba(91,124,250,0.4); } 50% { box-shadow: 0 0 0 6px rgba(91,124,250,0); } }
  .step-row span.label { font-size: 0.9rem; color: var(--text-muted); }
  .step-row.done span.label { color: var(--text-primary); }
  .step-row.active span.label { color: var(--text-primary); font-weight: 600; }
  .processing-disclaimer { text-align: center; font-size: 0.76rem; color: var(--text-faint); margin-top: 22px; }

  /* ---------- Resultados: 3 colunas ---------- */
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .results-header h1 { font-size: 1.35rem; }
  .results-layout { display: grid; grid-template-columns: 260px 1fr 300px; gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .results-layout { grid-template-columns: 1fr; } }

  .clip-list { display: flex; flex-direction: column; gap: 10px; max-height: 74vh; overflow-y: auto; padding-right: 4px; }
  .clip-list-item {
    display: flex; gap: 10px; padding: 10px; border-radius: var(--radius-md); cursor: pointer;
    border: 1px solid var(--border-subtle); background: var(--bg-panel); transition: all 0.15s;
  }
  .clip-list-item:hover { border-color: var(--border-strong); }
  .clip-list-item.selected { border-color: var(--accent-lime); background: rgba(124,252,60,0.05); }
  .clip-list-item .thumb { width: 52px; aspect-ratio: 9/16; border-radius: 6px; object-fit: cover; background: var(--bg-panel-2); flex-shrink: 0; }
  .clip-list-item .info { min-width: 0; flex: 1; }
  .clip-list-item .info-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .clip-list-item .duration { font-size: 0.76rem; color: var(--text-faint); }
  .clip-list-item.rejected { opacity: 0.45; }
  .clip-actions { display: flex; gap: 4px; margin-top: 8px; }
  .clip-action-btn {
    flex: 1; display: flex; align-items: center; justify-content: center;
    height: 26px; border-radius: 6px; border: 1px solid var(--border-subtle);
    background: var(--bg-panel-2); color: var(--text-muted); cursor: pointer; transition: all 0.15s;
  }
  .clip-action-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .clip-action-btn.approve.active { background: var(--accent-lime-soft); border-color: rgba(124,252,60,0.5); color: var(--accent-lime); }
  .clip-action-btn.reject.active { background: rgba(241,101,101,0.12); border-color: rgba(241,101,101,0.5); color: var(--accent-danger); }
  .clip-list-item .title { font-size: 0.82rem; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }

  .clip-preview { text-align: center; }
  .clip-preview video { width: 100%; max-width: 340px; border-radius: var(--radius-lg); background: black; margin: 0 auto; display: block; }
  .clip-preview .why { max-width: 340px; margin: 14px auto 0; text-align: left; font-size: 0.84rem; color: var(--text-muted); padding: 12px 14px; }
  .clip-preview .why strong { color: var(--accent-lime); display: block; margin-bottom: 3px; }

  .clip-panel { padding: 20px; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- Tela de revisão manual ---------- */
  .trim-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 6px; }
  @media (max-width: 640px) { .trim-row { grid-template-columns: 1fr; } }
  .trim-controls { display: flex; align-items: center; gap: 4px; }
  .trim-input {
    width: 68px; text-align: center; background: var(--bg-panel-2); color: var(--text-primary);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 7px 4px; font-size: 0.86rem;
  }
  .btn-trim {
    background: var(--bg-panel-2); border: 1px solid var(--border-subtle); color: var(--text-muted);
    border-radius: 6px; padding: 6px 7px; font-size: 0.74rem; cursor: pointer; font-weight: 600;
  }
  .btn-trim:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .transcript-hint { font-size: 0.78rem; color: var(--text-faint); margin: 2px 0 10px; }
  .transcript-panel { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .phrase-row {
    display: flex; gap: 10px; padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 0.85rem;
    color: var(--text-muted); transition: all 0.1s;
  }
  .phrase-row:hover { background: var(--bg-panel-2); }
  .phrase-row.selected { background: var(--accent-lime-soft); color: var(--text-primary); }
  .phrase-row .ts { font-family: 'Space Grotesk', sans-serif; font-size: 0.74rem; color: var(--text-faint); flex-shrink: 0; width: 42px; }
  .phrase-row.selected .ts { color: var(--accent-lime); }
  .review-candidate-item {
    display: flex; gap: 10px; padding: 12px; border-radius: var(--radius-md); cursor: pointer;
    border: 1px solid var(--border-subtle); background: var(--bg-panel); transition: all 0.15s;
  }
  .review-candidate-item:hover { border-color: var(--border-strong); }
  .review-candidate-item.selected { border-color: var(--accent-lime); background: rgba(124,252,60,0.05); }
  .review-candidate-item .excerpt { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
  .dirty-banner {
    display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #f0c975;
    background: rgba(240,201,117,0.1); border: 1px solid rgba(240,201,117,0.3);
    padding: 8px 12px; border-radius: var(--radius-sm); margin-top: 4px;
  }
  #reviewResultBox { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  #reviewResultBox video { width: 100%; max-width: 220px; border-radius: var(--radius-md); display: block; margin: 0 auto 10px; }
  .transcript-box {
    max-height: 170px; overflow-y: auto; font-size: 0.85rem; line-height: 1.75;
    padding: 10px 12px; background: var(--bg-panel-2); border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle); text-align: left;
  }
  .transcript-word { cursor: pointer; padding: 1px 2px; border-radius: 3px; }
  .transcript-word:hover { background: var(--accent-lime-soft); color: var(--accent-lime); }
  .transcript-word.in-range { background: rgba(91,124,250,0.2); }
  .transcript-empty { color: var(--text-faint); font-size: 0.82rem; text-align: center; padding: 10px; }
  .trim-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .trim-row input { text-align: center; }
  .trim-btn {
    width: 46px; height: 34px; border-radius: 8px; border: 1px solid var(--border-subtle);
    background: var(--bg-panel-2); color: var(--text-muted); cursor: pointer; font-size: 0.74rem; flex-shrink: 0;
  }
  .trim-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }
  .trim-mark-row { display: flex; gap: 6px; margin-top: 4px; }
  .btn-sm { padding: 6px 8px; font-size: 0.74rem; }
  .dirty-badge {
    background: rgba(255,176,32,0.12); color: #ffb020; border: 1px solid rgba(255,176,32,0.35);
    font-size: 0.78rem; padding: 7px 10px; border-radius: 8px; text-align: center;
  }
  .panel-group { display: flex; flex-direction: column; gap: 8px; }
  .panel-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .panel-actions .btn { width: 100%; }

  /* ---------- Responsivo ---------- */
  .sidebar-toggle { display: none; }
  @media (max-width: 880px) {
    .app-shell { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 240px; z-index: 100;
      transform: translateX(-100%); transition: transform 0.2s; box-shadow: 20px 0 40px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: inline-flex; }
    .content { padding: 20px; }
    .options-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a href="/" class="brand" title="Voltar pra página inicial">
      <img src="/assets/logo.png" alt="ClipRadar" style="width:24px; height:24px; border-radius:6px; object-fit:cover;">
      ClipRadar
    </a>
    <div class="nav-item primary" id="navCreate">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="navCreateLabel"></span>
    </div>
    <div class="nav-item active" id="navProjects">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/></svg>
      <span id="navProjectsLabel"></span>
    </div>
    <div class="nav-item" id="navLibrary">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/></svg>
      <span id="navLibraryLabel"></span>
    </div>

  const supported = ['pt', 'en', 'es'];
  const browserLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const lang of browserLangs) {
    const short = lang.slice(0, 2).toLowerCase();
    if (supported.includes(short)) return short;
  }
  return 'en';
}

function setView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (name === 'home') document.getElementById('navProjects').classList.add('active');
  els.sidebar.classList.remove('open');
}

function showToast(message, type = 'success') {
  const region = document.getElementById('toastRegion');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  region.appendChild(toast);
  setTimeout(() => toast.remove(), 4200);
}

/* ---------- Fonte do vídeo: dropzone / link / pasta do servidor ---------- */
const uploadDrop = document.getElementById('uploadDrop');
const uploadInput = document.getElementById('uploadInput');
const dropzoneTitleEl = document.getElementById('dropzoneTitle');
const youtubeUrlInput = document.getElementById('youtubeUrlInput');
const youtubeDownloadBtn = document.getElementById('youtubeDownloadBtn');
const folderToggle = document.getElementById('folderToggle');
const folderPicker = document.getElementById('folderPicker');
let folderOpen = false;

uploadDrop.addEventListener('click', () => uploadInput.click());
uploadDrop.addEventListener('dragover', (e) => { e.preventDefault(); uploadDrop.style.borderColor = 'var(--accent-lime)'; });
uploadDrop.addEventListener('dragleave', () => { uploadDrop.style.borderColor = ''; });
uploadDrop.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadDrop.style.borderColor = '';
  if (e.dataTransfer.files.length) {
    uploadInput.files = e.dataTransfer.files;
    uploadInput.dispatchEvent(new Event('change'));
  }
});

uploadInput.addEventListener('change', async () => {
  const file = uploadInput.files[0];
  if (!file) return;
  dropzoneTitleEl.textContent = T.upload_uploading;
  try {
    const formData = new FormData();
    formData.append('file', file);
    const res = await fetch('/api/videos/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || T.upload_error);
    lastVideoName = data.video_name;
    dropzoneTitleEl.textContent = T.dropzone_title;
    await loadVideos();
    els.videoSelect.value = data.video_name;
    await runGenerate(data.video_name);
  } catch (e) {
    dropzoneTitleEl.textContent = T.dropzone_title;
    showToast(e.message, 'error');
  }
});

folderToggle.addEventListener('click', () => {
  folderOpen = !folderOpen;
  folderPicker.classList.toggle('open', folderOpen);
  folderToggle.textContent = folderOpen ? T.folder_toggle_hide : T.folder_toggle_show;
});

youtubeDownloadBtn.addEventListener('click', async () => {
  const url = youtubeUrlInput.value.trim();
  if (!url) { showToast(T.youtube_url_missing, 'error'); return; }
  youtubeDownloadBtn.disabled = true;
  youtubeDownloadBtn.textContent = T.youtube_downloading;
  try {
    const res = await fetch('/api/videos/from-youtube', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || T.youtube_download_error);

    const poll = setInterval(async () => {
      const statusRes = await fetch(`/api/videos/download-status/${data.job_id}`);
      const statusData = await statusRes.json();
      if (statusData.status === 'running') return;
      clearInterval(poll);
      youtubeDownloadBtn.disabled = false;
      youtubeDownloadBtn.textContent = T.youtube_download_btn;
      if (statusData.status === 'error') { showToast(statusData.error || T.youtube_download_error, 'error'); return; }
      lastVideoName = statusData.video_name;
      youtubeUrlInput.value = '';
      await loadVideos();
      els.videoSelect.value = statusData.video_name;
      await runGenerate(statusData.video_name);
    }, 3000);
  } catch (e) {
    youtubeDownloadBtn.disabled = false;
    youtubeDownloadBtn.textContent = T.youtube_download_btn;
    showToast(e.message, 'error');
  }
});

async function loadVideos() {
  try {
    const res = await fetch('/api/videos');
    const data = await res.json();
    els.videoSelect.innerHTML = '';
    data.videos.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      els.videoSelect.appendChild(opt);
    });
    els.statusPill.textContent = data.videos.length === 0 ? T.status_no_videos : T.status_queue(data.videos.length);
  } catch (e) {
    els.statusPill.textContent = T.status_error;
  }
}

/* ---------- Processamento (etapas REAIS, vindas do servidor) ---------- */
const STEP_ORDER = ['prepared', 'transcribed', 'analyzed', 'editing', 'done'];
const STEP_LABEL_KEYS = { prepared: 'step_prepared', transcribed: 'step_transcribed', analyzed: 'step_analyzed', editing: 'step_editing', done: 'step_done' };
function serverStepToBucket(step, status) {
  if (status === 'done') return 'done';
  if (step === 'transcribing') return 'transcribed';
  if (step === 'scoring') return 'analyzed';
  if (step === 'rendering') return 'editing';
  return 'prepared'; // queued, detecting, ou desconhecido
}
function renderSteps(currentBucket) {
  const currentIdx = STEP_ORDER.indexOf(currentBucket);
  els.stepsList.innerHTML = STEP_ORDER.map((key, idx) => {
    const state = idx < currentIdx ? 'done' : (idx === currentIdx ? 'active' : '');
    const icon = state === 'done' ? '✓' : (idx + 1);
    return `<div class="step-row ${state}"><div class="dot">${icon}</div><span class="label">${T[STEP_LABEL_KEYS[key]]}</span></div>`;
  }).join('');
}

async function runGenerate(videoName) {
  lastVideoName = videoName;
  setView('processing');
  renderSteps('prepared');

  try {
    const res = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        video_name: videoName, mode: selectedMode, orientation: selectedOrientation,
        platform: selectedPlatform, burn_captions: els.captionsCheckbox.checked,
        subtitle_style: els.subtitleStyleSelect.value, preset: selectedPreset,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || T.generate_error_fallback);
    pollJob(data.job_id);
  } catch (e) {
    showToast(e.message, 'error');
    setView('home');
  }
}

function pollJob(jobId) {
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/status/${jobId}`);
      const data = await res.json();

      if (data.status === 'running') {
        renderSteps(serverStepToBucket(data.step, data.status));
        return;
      }

      clearInterval(pollTimer);

      if (data.status === 'error') {
        showToast(data.error || T.processing_failed, 'error');
        setView('home');
        return;
      }

      renderSteps('done');
      setTimeout(() => showResults(data), 350);
    } catch (e) {
      clearInterval(pollTimer);
      showToast(T.connection_lost, 'error');
      setView('home');
    }
  }, 2000);
}

/* ---------- Resultados (3 colunas) ---------- */
function normalizeClips(data) {
  if (data.mode === 'separate') return data.clips || [];
  if (!data.final_video) return [];
  return [{
    clip_id: 'montagem', score: Math.max(0, ...((data.preview_cards || []).map(c => c.score))) || 0,
    duration_seconds: data.duration_seconds, video: data.final_video, thumbnail: data.thumbnail,
    edit_plan: data.edit_plan, is_montage: true,
  }];
}

function formatDuration(seconds) {
  if (!seconds && seconds !== 0) return '';
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function showResults(data) {
  currentClips = normalizeClips(data);
  currentClipIndex = 0;

  if (!currentClips.length) {
    showToast(T.no_good_moments, 'error');
    setView('home');
    return;
  }

  showToast(T.toast_generated, 'success');
  recentProjects.unshift({
    video_name: lastVideoName, thumbnail: currentClips[0].thumbnail,
    clip_count: currentClips.length, saved: false,
  });
  renderRecent();

  renderClipList();
  selectClip(0);
  setView('results');
}

function renderClipList() {
  els.clipList.innerHTML = currentClips.map((c, idx) => {
    const tagKey = c.edit_plan ? CLIP_TYPE_TAG_KEY[c.edit_plan.clip_type] : null;
    const tagHtml = tagKey ? `<span class="badge badge-tag">${T[tagKey]}</span>` : '';
    const status = c.reviewStatus || 'pending';
    return `
      <div class="clip-list-item ${idx === currentClipIndex ? 'selected' : ''} ${status === 'rejected' ? 'rejected' : ''}" data-idx="${idx}">
        <img class="thumb" src="${c.thumbnail || ''}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div class="info-top">
            <span class="badge badge-score">${Math.round(c.score)}</span>
            ${tagHtml}
          </div>
          <div class="title">${c.is_montage ? T.results_title : (c.clip_id || '')}</div>
          <div class="duration">${formatDuration(c.duration_seconds)}</div>
          <div class="clip-actions">
            <button class="clip-action-btn approve ${status === 'approved' ? 'active' : ''}" data-action="approve" data-idx="${idx}" title="${T.action_approve}" aria-label="${T.action_approve}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="clip-action-btn reject ${status === 'rejected' ? 'active' : ''}" data-action="reject" data-idx="${idx}" title="${T.action_reject}" aria-label="${T.action_reject}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </button>
            <button class="clip-action-btn edit" data-action="edit" data-idx="${idx}" title="${T.action_edit}" aria-label="${T.action_edit}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4.4L15.6 5 19 8.4 8.4 19 4 20z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  els.clipList.querySelectorAll('.clip-list-item').forEach(item => {
    item.addEventListener('click', () => selectClip(parseInt(item.dataset.idx, 10)));
  });
  els.clipList.querySelectorAll('.clip-action-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx, 10);
      const action = btn.dataset.action;
      const clip = currentClips[idx];
      if (action === 'approve') {
        clip.reviewStatus = clip.reviewStatus === 'approved' ? 'pending' : 'approved';
      } else if (action === 'reject') {
        clip.reviewStatus = clip.reviewStatus === 'rejected' ? 'pending' : 'rejected';
      } else if (action === 'edit') {
        selectClip(idx);
        setTimeout(() => document.getElementById('clipTitleInput')?.focus(), 50);
        return;
      }
      renderClipList();
    });
  });
}

function selectClip(idx) {
  currentClipIndex = idx;
  const clip = currentClips[idx];
  els.clipList.querySelectorAll('.clip-list-item').forEach((item, i) => {
    item.classList.toggle('selected', i === idx);
  });
  els.clipPreviewVideo.src = clip.video;

  if (clip.edit_plan && clip.edit_plan.explanation) {
    els.clipWhyBox.style.display = 'block';
    els.clipWhyBox.innerHTML = `<strong>${T.why_label}</strong>${clip.edit_plan.explanation}`;
  } else {
    els.clipWhyBox.style.display = 'none';
  }

  renderClipPanel(clip);
}

function renderClipPanel(clip) {
  const defaultTitle = clip.edit_plan && clip.edit_plan.highlight_words && clip.edit_plan.highlight_words.length
    ? clip.edit_plan.highlight_words.join(' ')
    : '';

  els.clipPanel.innerHTML = `
    <div class="panel-group">
      <span class="field-label">${T.panel_format}</span>
      <div class="badge badge-muted">${selectedOrientation === 'vertical' ? T.format_vertical : T.format_horizontal}${selectedPlatform !== 'sem_preferencia' ? ' · ' + selectedPlatform : ''}</div>
    </div>
    <div class="panel-group">
      <span class="field-label">${T.panel_layout}</span>
      <div class="badge badge-muted">${selectedPreset === 'clean' ? T.preset_clean : T.preset_impact}</div>
    </div>
    <div class="panel-group">
      <span class="field-label">${T.panel_subtitle}</span>
      <div class="badge badge-muted">${els.captionsCheckbox.checked ? els.subtitleStyleSelect.selectedOptions[0].textContent : '—'}</div>
    </div>
    <div class="panel-group">
      <span class="field-label">${T.panel_title}</span>
      <input type="text" id="clipTitleInput" placeholder="${T.panel_title_placeholder}" value="${defaultTitle}">
    </div>
    <div class="panel-actions">
      <a class="btn btn-secondary" id="downloadClipBtn" href="${clip.video}" download>${T.action_download_clip}</a>
      ${clip.thumbnail ? `<a class="btn btn-secondary" href="${clip.thumbnail}" download>${T.action_download_thumb}</a>` : ''}
      <button class="btn btn-secondary" id="saveDraftBtn">${T.action_save_draft}</button>
      <button class="btn btn-primary" id="regenerateBtn">${T.action_regenerate}</button>
    </div>
  `;

  document.getElementById('saveDraftBtn').addEventListener('click', (e) => {
    e.target.textContent = T.action_saved_draft;
    e.target.disabled = true;
    if (recentProjects[0]) { recentProjects[0].saved = true; renderRecent(); }
  });
  document.getElementById('regenerateBtn').addEventListener('click', () => {
    if (lastVideoName) runGenerate(lastVideoName);
  });
}

/* ---------- Revisão manual (analisar sem renderizar, ajustar, renderizar sob demanda) ---------- */
let reviewCandidates = [];
let reviewAnalysisPath = null;
let reviewVideoUrl = null;
let reviewSelectedIdx = 0;
let reviewClipStates = {};
let reviewSelectionAnchor = null;

const reviewEls = {
  candidateList: document.getElementById('reviewCandidateList'),
  video: document.getElementById('reviewPreviewVideo'),
  trimStartInput: document.getElementById('trimStartInput'),
  trimEndInput: document.getElementById('trimEndInput'),
  transcriptPanel: document.getElementById('transcriptPanel'),
  panel: document.getElementById('reviewPanel'),
  resultBox: document.getElementById('reviewResultBox'),
};

function defaultReviewState(candidate) {
  return {
    start: candidate.context_start_seconds, end: candidate.end_seconds, title: '',
    orientation: 'vertical', platform: 'sem_preferencia', preset: 'clean', layout: 'gameplay_full',
    subtitleStyle: 'classic', burnCaptions: true, renderedSnapshot: null, result: null,
  };
}

function getReviewState(idx) {
  const c = reviewCandidates[idx];
  if (!reviewClipStates[c.clip_id]) reviewClipStates[c.clip_id] = defaultReviewState(c);
  return reviewClipStates[c.clip_id];
}

function snapshotKey(state) {
  return JSON.stringify({
    start: Math.round(state.start * 10), end: Math.round(state.end * 10),
    orientation: state.orientation, platform: state.platform, preset: state.preset,
    layout: state.layout, subtitleStyle: state.subtitleStyle, burnCaptions: state.burnCaptions,
  });
}

async function startAnalyze(videoName) {
  lastVideoName = videoName;
  setView('processing');
  renderSteps('prepared');
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ video_name: videoName }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || T.generate_error_fallback);
    pollAnalyzeJob(data.job_id);
  } catch (e) {
    showToast(e.message, 'error');
    setView('home');
  }
}

function pollAnalyzeJob(jobId) {
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/analyze-status/${jobId}`);
      const data = await res.json();
      if (data.status === 'running') { renderSteps(serverStepToBucket(data.step, data.status)); return; }
      clearInterval(pollTimer);
      if (data.status === 'error') { showToast(data.error || T.processing_failed, 'error'); setView('home'); return; }
      renderSteps('analyzed');
      setTimeout(() => showReview(data), 300);
    } catch (e) {
      clearInterval(pollTimer);
      showToast(T.connection_lost, 'error');
      setView('home');
    }
  }, 2000);
}

function showReview(data) {
  reviewCandidates = data.candidates || [];
  reviewAnalysisPath = data.analysis_path;
  reviewVideoUrl = data.video_url;
  reviewClipStates = {};
  reviewSelectedIdx = 0;

  if (!reviewCandidates.length) {
    showToast(T.review_no_candidates, 'error');
    setView('home');
    return;
  }

  reviewEls.video.src = reviewVideoUrl;
  renderReviewCandidateList();
  selectReviewCandidate(0);
  setView('review');
}

function renderReviewCandidateList() {
  reviewEls.candidateList.innerHTML = reviewCandidates.map((c, idx) => `
    <div class="review-candidate-item ${idx === reviewSelectedIdx ? 'selected' : ''}" data-idx="${idx}">
      <div style="flex:1; min-width:0;">
        <span class="badge badge-score">${Math.round(c.score)}</span>
        <div class="excerpt">${(c.transcript_excerpt || '').slice(0, 90)}</div>
      </div>
    </div>
  `).join('');
  reviewEls.candidateList.querySelectorAll('.review-candidate-item').forEach(item => {
    item.addEventListener('click', () => selectReviewCandidate(parseInt(item.dataset.idx, 10)));
  });
}

function selectReviewCandidate(idx) {
  reviewSelectedIdx = idx;
  reviewSelectionAnchor = null;
  reviewEls.candidateList.querySelectorAll('.review-candidate-item').forEach((item, i) => {
    item.classList.toggle('selected', i === idx);
  });
  const candidate = reviewCandidates[idx];
  const state = getReviewState(idx);
  reviewEls.video.currentTime = state.start;
  updateTrimInputs(state);
  renderTranscriptPanel(candidate, state);
  renderReviewPanel(candidate, state);
}

function updateTrimInputs(state) {
  reviewEls.trimStartInput.value = state.start.toFixed(1);
  reviewEls.trimEndInput.value = state.end.toFixed(1);
}

function renderTranscriptPanel(candidate, state) {
  document.getElementById('transcriptHint').textContent = T.transcript_hint;
  reviewEls.transcriptPanel.innerHTML = (candidate.phrases || []).map((p, i) => {
    const selected = p.start >= state.start - 0.05 && p.end <= state.end + 0.05;
    return `<div class="phrase-row ${selected ? 'selected' : ''}" data-idx="${i}"><span class="ts">${formatDuration(p.start)}</span><span>${p.text}</span></div>`;
  }).join('');

  reviewEls.transcriptPanel.querySelectorAll('.phrase-row').forEach(row => {
    row.addEventListener('click', (e) => {
      const idx = parseInt(row.dataset.idx, 10);
      const phrase = candidate.phrases[idx];
      if (e.shiftKey && reviewSelectionAnchor !== null) {
        const lo = Math.min(reviewSelectionAnchor, idx);
        const hi = Math.max(reviewSelectionAnchor, idx);
        const group = candidate.phrases.slice(lo, hi + 1);
        state.start = Math.min(...group.map(p => p.start));
        state.end = Math.max(...group.map(p => p.end));
        updateTrimInputs(state);
        renderTranscriptPanel(candidate, state);
        renderReviewPanel(candidate, state);
      } else {
        reviewSelectionAnchor = idx;
        reviewEls.video.currentTime = phrase.start;
        reviewEls.video.play().catch(() => {});
      }
    });
  });
}

document.querySelectorAll('.btn-trim').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!reviewCandidates.length) return;
    const state = getReviewState(reviewSelectedIdx);
    const delta = parseFloat(btn.dataset.delta);
    if (btn.dataset.target === 'start') state.start = Math.max(0, Math.round((state.start + delta) * 10) / 10);
    else state.end = Math.max(state.start + 1, Math.round((state.end + delta) * 10) / 10);
    updateTrimInputs(state);
    renderTranscriptPanel(reviewCandidates[reviewSelectedIdx], state);
    renderReviewPanel(reviewCandidates[reviewSelectedIdx], state);
  });
});

[reviewEls.trimStartInput, reviewEls.trimEndInput].forEach(input => {
  input.addEventListener('change', () => {
    if (!reviewCandidates.length) return;
    const state = getReviewState(reviewSelectedIdx);
    const startVal = parseFloat(reviewEls.trimStartInput.value);
    const endVal = parseFloat(reviewEls.trimEndInput.value);
    if (!isNaN(startVal)) state.start = Math.max(0, startVal);
    if (!isNaN(endVal)) state.end = Math.max(state.start + 1, endVal);
    updateTrimInputs(state);
    renderTranscriptPanel(reviewCandidates[reviewSelectedIdx], state);
    renderReviewPanel(reviewCandidates[reviewSelectedIdx], state);
  });
});

function renderReviewPanel(candidate, state) {
  const dirty = state.renderedSnapshot !== snapshotKey(state);
  const dirtyBanner = (dirty && state.renderedSnapshot !== null) ? `<div class="dirty-banner">⚠ ${T.dirty_banner}</div>` : '';

  reviewEls.panel.innerHTML = `
    <div class="panel-group">
      <span class="field-label">${T.panel_title}</span>
      <input type="text" id="reviewTitleInput" placeholder="${T.panel_title_placeholder}" value="${state.title}">
    </div>
    <div class="panel-group">
      <span class="field-label">${T.label_format}</span>
      <div class="tabs" id="reviewOrientationTabs">
        <div class="tab ${state.orientation === 'vertical' ? 'active' : ''}" data-value="vertical">${T.format_vertical}</div>
        <div class="tab ${state.orientation === 'horizontal' ? 'active' : ''}" data-value="horizontal">${T.format_horizontal}</div>
      </div>
    </div>
    <div class="panel-group">
      <span class="field-label">${T.label_platform}</span>
      <div class="tabs" id="reviewPlatformTabs">
        ${['sem_preferencia', 'tiktok', 'reels', 'shorts'].map(p => `<div class="tab ${state.platform === p ? 'active' : ''}" data-value="${p}">${p === 'sem_preferencia' ? T.platform_none : p}</div>`).join('')}
      </div>
    </div>
    <div class="panel-group">
      <span class="field-label">${T.label_preset}</span>
      <div class="tabs" id="reviewPresetTabs">
        <div class="tab ${state.preset === 'clean' ? 'active' : ''}" data-value="clean">${T.preset_clean}</div>
        <div class="tab ${state.preset === 'impact' ? 'active' : ''}" data-value="impact">${T.preset_impact}</div>
        <div class="tab ${state.preset === 'streamer' ? 'active' : ''}" data-value="streamer">${T.preset_streamer}</div>
      </div>
    </div>
    <div class="panel-group">
      <span class="field-label">${T.label_layout}</span>
      <div class="tabs" id="reviewLayoutTabs" style="flex-wrap:wrap;">
        <div class="tab ${state.layout === 'gameplay_full' ? 'active' : ''}" data-value="gameplay_full">${T.layout_gameplay_full}</div>
        <div class="tab ${state.layout === 'gameplay_facecam' ? 'active' : ''}" data-value="gameplay_facecam">${T.layout_gameplay_facecam}</div>
        <div class="tab ${state.layout === 'facecam_focus' ? 'active' : ''}" data-value="facecam_focus">${T.layout_facecam_focus}</div>
      </div>
    </div>
    <div class="panel-group">
      <span class="field-label">${T.label_subtitle_style}</span>
      <select id="reviewSubtitleSelect">
        <option value="classic" ${state.subtitleStyle === 'classic' ? 'selected' : ''}>${T.style_classic}</option>
        <option value="bold_yellow" ${state.subtitleStyle === 'bold_yellow' ? 'selected' : ''}>${T.style_bold_yellow}</option>
        <option value="minimal_top" ${state.subtitleStyle === 'minimal_top' ? 'selected' : ''}>${T.style_minimal_top}</option>
        <option value="boxed" ${state.subtitleStyle === 'boxed' ? 'selected' : ''}>${T.style_boxed}</option>
      </select>
      <div class="checkbox-row" style="margin-top:8px;">
        <input type="checkbox" id="reviewCaptionsCheckbox" ${state.burnCaptions ? 'checked' : ''}>
        <label for="reviewCaptionsCheckbox">${T.label_captions}</label>
      </div>
    </div>
    ${dirtyBanner}
    <button class="btn btn-primary" id="reviewRenderBtn" style="width:100%;">${T.review_render_btn}</button>
  `;

  document.getElementById('reviewTitleInput').addEventListener('input', (e) => { state.title = e.target.value; });
  setupTabs(document.getElementById('reviewOrientationTabs'), v => { state.orientation = v; renderReviewPanel(candidate, state); });
  setupTabs(document.getElementById('reviewPlatformTabs'), v => { state.platform = v; renderReviewPanel(candidate, state); });
  setupTabs(document.getElementById('reviewPresetTabs'), v => { state.preset = v; renderReviewPanel(candidate, state); });
  setupTabs(document.getElementById('reviewLayoutTabs'), v => { state.layout = v; renderReviewPanel(candidate, state); });
  document.getElementById('reviewSubtitleSelect').addEventListener('change', (e) => { state.subtitleStyle = e.target.value; renderReviewPanel(candidate, state); });
  document.getElementById('reviewCaptionsCheckbox').addEventListener('change', (e) => { state.burnCaptions = e.target.checked; renderReviewPanel(candidate, state); });
  document.getElementById('reviewRenderBtn').addEventListener('click', () => renderReviewClip(candidate, state));

  renderReviewResultBox(state);
}

function renderReviewResultBox(state) {
  if (!state.result) { reviewEls.resultBox.style.display = 'none'; reviewEls.resultBox.innerHTML = ''; return; }
  reviewEls.resultBox.style.display = 'block';
  reviewEls.resultBox.innerHTML = `
    <video src="${state.result.video}" controls></video>
    <a class="btn btn-secondary" style="width:100%; max-width:220px; display:flex; margin:0 auto;" href="${state.result.video}" download>${T.review_download}</a>
  `;
}

async function renderReviewClip(candidate, state) {
  const btn = document.getElementById('reviewRenderBtn');
  btn.disabled = true;
  btn.textContent = T.review_rendering;
  try {
    const res = await fetch('/api/render-clip', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        analysis_path: reviewAnalysisPath, clip_id: candidate.clip_id,
        start_seconds: state.start, end_seconds: state.end,
        orientation: state.orientation, burn_captions: state.burnCaptions,
        subtitle_style: state.subtitleStyle, preset: state.preset, layout: state.layout,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || T.generate_error_fallback);
    state.result = data;
    state.renderedSnapshot = snapshotKey(state);
    showToast(T.toast_generated, 'success');
    renderReviewPanel(candidate, state);
  } catch (e) {
    showToast(e.message, 'error');
    btn.disabled = false;
    btn.textContent = T.review_render_btn;
  }
}

document.getElementById('backToHomeFromReviewBtn').addEventListener('click', () => setView('home'));

els.generateBtn.addEventListener('click', () => {
  const videoName = els.videoSelect.value || lastVideoName;
  if (!videoName) { showToast(T.dropzone_title, 'error'); return; }
  if (selectedMode === 'review') {
    startAnalyze(videoName);
  } else {
    runGenerate(videoName);
  }
});

loadVideos();
</script>
</body>
</html>
